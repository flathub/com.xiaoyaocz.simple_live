app-id: com.xiaoyaocz.simple_live
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
command: simple_live
separate-locales: false
finish-args:
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --device=dri
  - --socket=pulseaudio
  - --share=network
  - --talk-name=org.freedesktop.ScreenSaver
  - --system-talk-name=org.freedesktop.NetworkManager.IP4Config
cleanup:
  - /include
  - /lib/pkgconfig
  - /share/doc
  - /share/man
  - '*.la'
  - '*.a'

modules:
  - name: simple_live
    buildsystem: simple
    build-commands:
      # copy lib and data folders
      - install -d "${FLATPAK_DEST}/lib"
      - cp -r lib/* "${FLATPAK_DEST}/lib/"
      - install -d "${FLATPAK_DEST}/data"
      - cp -r data/* "${FLATPAK_DEST}/data/"

      # copy executable
      - install -Dm755 simple_live_app "${FLATPAK_DEST}/simple_live_app"
      - mkdir -p "${FLATPAK_DEST}/bin"
      - ln -s "${FLATPAK_DEST}/simple_live_app" "${FLATPAK_DEST}/bin/simple_live"

      # copy metadata files
      - install -Dm644 com.xiaoyaocz.simple_live.desktop -t ${FLATPAK_DEST}/share/applications/
      - install -Dm644 com.xiaoyaocz.simple_live.metainfo.xml -t ${FLATPAK_DEST}/share/metainfo/
      - install -Dm644 com.xiaoyaocz.simple_live.png -t ${FLATPAK_DEST}/share/icons/hicolor/512x512/apps/

    sources:
      - type: archive
        only-arches: [x86_64]
        strip-components: 0
        # Link needs to be replaced when this is upstreamed
        url: https://github.com/s-kk/dart_simple_live/releases/download/v1.8.6/simple_live_app-1.8.7+10807-linux-ubuntu-24.04.zip
        sha256: ed56df783121eb15b03ab4709127a4e84a119df9d71a836266e29c99d9ea1431
        # x-checker-data:
        #   type: json
        #   url: https://api.github.com/repos/s-kk/dart_simple_live/releases/latest
        #   version-query: .tag_name | sub(\"v\";\"\")
        #   url-query: .assets[] | select(.name | match("simple_live_app-.*ubuntu-24.04\\.zip"))
        #     | .browser_download_url
      - type: archive
        only-arches: [aarch64]
        strip-components: 0
        # Link needs to be replaced when this is upstreamed
        url: https://github.com/s-kk/dart_simple_live/releases/download/v1.8.6/simple_live_app-1.8.7+10807-linux-ubuntu-24.04-arm.zip
        sha256: e6069f0ae5bd68debfe45eba0082cb1081e490874fad7ea5fb7c5634adad148e
        # x-checker-data:
        #   type: json
        #   url: https://api.github.com/repos/s-kk/dart_simple_live/releases/latest
        #   version-query: .tag_name | sub(\"v\";\"\")
        #   url-query: .assets[] | select(.name | match("simple_live_app-.*ubuntu-24.04-arm\\.zip"))
        #     | .browser_download_url
      - type: file
        path: com.xiaoyaocz.simple_live.metainfo.xml
      - type: file
        path: com.xiaoyaocz.simple_live.desktop
      - type: file
        dest-filename: com.xiaoyaocz.simple_live.png
        url: https://raw.githubusercontent.com/s-kk/dart_simple_live/692380b8c44ccaeafb2f9697b224e2617f6abe64/simple_live_app/assets/logo_circle_512.png
        sha256: d9b4c02f2c0efe6485f6071050fae255b8074aa170950ecc90e74c9514c69f13
      - type: file
        url: https://raw.githubusercontent.com/s-kk/dart_simple_live/5f0477719d616e34a0c18712adbcf537903a267f/LICENSE
        sha256: 8732d30e41074431cfb00590d11bcf9b50a338cc0c90a6636310054ba9eeb22f
    modules:
      - name: libmpv
        cleanup:
          - /share/applications
          - /share/bash-completion
          - /share/icons
          - /share/zsh
        buildsystem: meson
        config-opts:
          - -Dlibmpv=true
          - -Dbuild-date=false
          - -Dalsa=disabled
          - -Dlua=disabled
          - -Dcplayer=false
        sources:
          - type: archive
            url: https://github.com/mpv-player/mpv/archive/v0.41.0.tar.gz
            sha256: ee21092a5ee427353392360929dc64645c54479aefdb5babc5cfbb5fad626209
            x-checker-data:
              type: anitya
              project-id: 5348
              stable-only: true
              url-template: https://github.com/mpv-player/mpv/archive/v$version.tar.gz
              is-important: true

        modules:
          - name: libass
            config-opts:
              - --disable-static
            sources:
              - type: archive
                url: https://github.com/libass/libass/releases/download/0.17.4/libass-0.17.4.tar.xz
                sha256: 78f1179b838d025e9c26e8fef33f8092f65611444ffa1bfc0cfac6a33511a05a
                x-checker-data:
                  type: anitya
                  project-id: 1560
                  stable-only: true
                  url-template: https://github.com/libass/libass/releases/download/$version/libass-$version.tar.xz

          - name: uchardet
            buildsystem: cmake-ninja
            config-opts:
              - -DCMAKE_BUILD_TYPE=Release
              - -DBUILD_STATIC=0
              - -DCMAKE_POLICY_VERSION_MINIMUM=3.5
            cleanup:
              - /bin
              - /lib/cmake
            sources:
              - type: archive
                url: https://www.freedesktop.org/software/uchardet/releases/uchardet-0.0.8.tar.xz
                sha256: e97a60cfc00a1c147a674b097bb1422abd9fa78a2d9ce3f3fdcc2e78a34ac5f0
                x-checker-data:
                  type: anitya
                  project-id: 9265
                  stable-only: true
                  url-template: https://www.freedesktop.org/software/uchardet/releases/uchardet-$version.tar.xz

          - name: rubberband
            buildsystem: meson
            config-opts:
              - -Ddefault_library=shared
            cleanup:
              - /bin
              - /lib/ladspa
            sources:
              - type: archive
                url: https://breakfastquay.com/files/releases/rubberband-4.0.0.tar.bz2
                sha256: af050313ee63bc18b35b2e064e5dce05b276aaf6d1aa2b8a82ced1fe2f8028e9
                x-checker-data:
                  type: anitya
                  project-id: 4222
                  stable-only: true
                  url-template: https://breakfastquay.com/files/releases/rubberband-$version.tar.bz2

          - name: mujs
            buildsystem: autotools
            no-autogen: true
            make-args:
              - release
            make-install-args:
              - prefix=/app
              - install-shared
            cleanup:
              - /bin
            sources:
              - type: git
                url: https://codeberg.org/ccxvii/mujs.git
                tag: 1.3.8
                commit: 307f18c4216420f2f56e22d8e7040baa39a6304a
                x-checker-data:
                  type: json
                  url: https://codeberg.org/api/v1/repos/ccxvii/mujs/tags
                  tag-query: .[0].name
                  version-query: $tag
                  timestamp-query: .[0].commit.created

              # The unicode character database files are downloaded in the makefile rules `UnicodeData.txt` and `SpecialCasing.txt`.
              # This does not work with flatpak because there is no network access during the build step.
              #
              # TODO: check for updated urls when updating mujs
              - type: file
                url: https://www.unicode.org/Public/16.0.0/ucd/UnicodeData.txt
                sha256: ff58e5823bd095166564a006e47d111130813dcf8bf234ef79fa51a870edb48f

              - type: file
                url: https://www.unicode.org/Public/16.0.0/ucd/SpecialCasing.txt
                sha256: 8d5de354eef79f2395a54c9c7dcebbaf3d30fc962d0f85611ea97aa973a0c451

          - name: libplacebo
            buildsystem: meson
            config-opts:
              - -Dglslang=enabled
            sources:
              - type: git
                url: https://github.com/haasn/libplacebo.git
                tag: v7.360.1
                commit: cee9b076f2c63104ccfd497fa79c39a867293ec4
                x-checker-data:
                  type: git
                  tag-pattern: ^v([\d.]+)$
